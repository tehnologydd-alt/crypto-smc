name: ApexiCrypto bootstrap and Android APK
on:
  push:
    branches: [apexicrypto-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract standalone ApexiCrypto source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .source/apexi.tar.xz.b64 ]; then
            base64 --decode .source/apexi.tar.xz.b64 | tar -xJf -
            rm -rf .source
            git checkout -- .github/workflows/build-apk.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack independent ApexiCrypto Android project"
            git push origin HEAD:apexicrypto-android
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate app icons
        run: node scripts/generate-icons.js
      - name: Validate TS
        run: npm run lint
      - name: Build web bundle
        run: npm run build
      - name: Initialize Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ApexiCrypto-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
