name: Restore and Build ApexiCrypto Android
on:
  workflow_dispatch:
  push:
    branches: [apexicrypto-android]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore original source
        run: |
          tar -xJf source/apexicrypto.tar.xz
          test -f package.json
          test -f src/components/AISignalPanel.tsx
          test -f src/lib/forecast.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: node scripts/generate-icons.js
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Assemble Android debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ApexiCrypto-restored-original-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish readable restored source to the same branch
        run: |
          rm -rf source android node_modules dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Publish restored original ApexiCrypto Android source"
            git push origin HEAD:apexicrypto-android
          fi
