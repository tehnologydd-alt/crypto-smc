name: APEX AI — device pairing safety checks
on:
  push:
    branches: [apex-ai-device-pairing-20261113]
    paths:
      - 'apex-ai-research/edge/**'
      - 'apex9-preview/app.mjs'
      - 'apex9-preview/index.html'
      - 'apex9-preview/mobile-bridge.mjs'
      - 'apex9-android/native/src/main/java/com/apexintelligence/research/ApexAiDevice.kt'
      - '.github/workflows/apex-ai-device-pairing-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check apex-ai-research/edge/worker.mjs
          node --check apex-ai-research/edge/device-auth.mjs
          node --check apex9-preview/app.mjs
          node --check apex9-preview/mobile-bridge.mjs
      - name: Cloudflare auth, budget and safe pairing tests
        run: |
          node --test apex-ai-research/edge/test-worker.mjs apex-ai-research/edge/test-budget-governor.mjs apex-ai-research/edge/test-device-auth.mjs
      - name: Android bridge and local assets
        run: |
          node apex9-android/scripts/prepare-web.mjs --check
