name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        id: build_debug
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Expose build diagnostics
        if: failure()
        run: |
          echo '--- Gradle build log (last 120 lines) ---'
          if [ -f build.log ]; then tail -n 120 build.log; fi
          echo '--- End Gradle build log ---'

      - uses: actions/upload-artifact@v4
        with:
          name: crypto-smc-debug
          path: app/build/outputs/apk/debug/*.apk
