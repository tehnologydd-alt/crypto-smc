name: APEX Intelligence V2 Debug APK
on:
  push:
    branches: [apex-intelligence-v2]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore APEX V2 source
        run: |
          test -f source/APEX_Intelligence_V2.b64.txt
          rm -rf src scripts native
          base64 -d source/APEX_Intelligence_V2.b64.txt | tar -xJf -
          sed -i 's/, "vite-plugin-pwa\/client"//g' tsconfig.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and test
        run: |
          npm install --no-audit --no-fund
          npm run test
          npm run lint
      - name: Build web and Android app
        run: |
          node scripts/generate-icons.js
          npm run build
          npx cap add android
          npx cap sync android
          node scripts/apply-android.js
      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APEX-Intelligence-V2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
