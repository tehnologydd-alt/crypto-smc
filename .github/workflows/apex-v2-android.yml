name: APEX Intelligence V2 Debug APK
on:
  push:
    branches: [apex-intelligence-v2]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APEX_KEYSTORE_B64: ${{ secrets.APEX_KEYSTORE_B64 }}
      APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
      APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
      APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore APEX V2 source
        run: |
          test -f source/APEX_Intelligence_V2.b64.txt
          rm -rf src scripts native
          base64 -d source/APEX_Intelligence_V2.b64.txt | tar -xJf -
          if [ -f source/APEX_Intelligence_2_3_overlay.b64.txt ]; then
            base64 -d source/APEX_Intelligence_2_3_overlay.b64.txt | tar -xJf -
            echo "Applied APEX 2.3 lifecycle and full catalog overlay"
          fi
          if [ -f updates/apply-watch.cjs ]; then node updates/apply-watch.cjs; fi
          node updates/inspect-native-v43.cjs
          sed -i 's/, "vite-plugin-pwa\/client"//g' tsconfig.json
          # Normalize the test harness for GitHub's installed TypeScript dependency.
          sed -i "s#require('/opt/nvm/versions/node/v22.16.0/lib/node_modules/typescript')#require('typescript')#g" scripts/test-intelligence.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and test
        run: |
          npm install --no-audit --no-fund
          npm run test
          npm run lint
      - name: Build web and Android app
        run: |
          node scripts/generate-icons.js
          npm run build
          npx cap add android
          npx cap sync android
          node scripts/apply-android.js
          node updates/configure-release.cjs
      - name: Assemble APEX APK
        run: |
          chmod +x android/gradlew
          if [ -f .apex-signed-release ]; then
            cd android && ./gradlew assembleRelease
          else
            echo "::warning::Release signing secrets are not configured; building non-updatable debug APK."
            cd android && ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: APEX-Intelligence-V2-APK
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
