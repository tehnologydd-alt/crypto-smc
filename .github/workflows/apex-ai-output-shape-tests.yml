name: APEX AI - GLM Qwen final output diagnostics
on:
  push:
    branches: [apex-ai-live-audit-20261113, apex-dev]
    paths:
      - 'apex-ai-research/edge/**'
      - 'apex9-preview/cloud-ai-*'
      - 'apex9-preview/test-cloud-ai-*'
      - 'apex9-preview/app.mjs'
      - 'apex9-preview/apex-research-history.mjs'
      - 'apex9-preview/test-apex-research-history.mjs'
      - '.github/workflows/apex-ai-output-shape-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parse-model-output:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and safe unit tests (no model calls, no D1 writes)
        run: |
          node --check apex-ai-research/edge/worker.mjs
          node --check apex9-preview/cloud-ai-collective.mjs
          node --check apex9-preview/cloud-ai-batch.mjs
          node --check apex-ai-research/edge/batch-audit.mjs
          node --check apex9-preview/apex-research-director-core.mjs
          node --check apex9-preview/apex-research-director-ui.mjs
          node --check apex9-preview/apex-research-history.mjs
          node --check apex9-preview/app.mjs
          # Validate real two-step policy with no calls to the deployed AI
          node --test apex-ai-research/edge/test-worker.mjs apex-ai-research/edge/test-budget-governor.mjs apex-ai-research/edge/test-device-auth.mjs
          node --test apex-ai-research/edge/test-batch-audit.mjs apex-ai-research/edge/test-adaptive-budget.mjs apex9-preview/test-cloud-ai-batch.mjs apex9-preview/test-cloud-ai-monitor.mjs
          node --test apex9-preview/test-cloud-ai-collective.mjs apex9-preview/test-cloud-ai-manual-audit.mjs
          node --test apex-ai-research/edge/test-offline-research-benchmark.mjs
          node --test apex9-preview/test-apex-research-director.mjs apex9-preview/test-apex-research-history.mjs apex9-preview/test-portable-cloud-backup.mjs
