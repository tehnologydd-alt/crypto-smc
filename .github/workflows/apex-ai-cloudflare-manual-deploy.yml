name: APEX AI Collective — manual Cloudflare deploy

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type DEPLOY_APEX_AI to deploy only the new APEX AI Worker"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-ai-edge:
    if: github.event.inputs.approval == 'DEPLOY_APEX_AI'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APEX_AI_D1_DATABASE_ID: ${{ vars.APEX_AI_D1_DATABASE_ID }}
      APEX_AI_WORKER_ORIGIN: ${{ vars.APEX_AI_WORKER_ORIGIN }}
    defaults:
      run:
        working-directory: apex-ai-research/edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate free-tier account configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Cloudflare token secret missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare account ID secret missing"; exit 1; }
          test -n "$APEX_AI_D1_DATABASE_ID" || { echo "::error::APEX AI D1 ID missing"; exit 1; }
          test -n "$APEX_AI_WORKER_ORIGIN" || { echo "::error::APEX AI Worker origin missing"; exit 1; }
          node --input-type=module -e '
            const fs=await import("node:fs");
            const id=process.env.APEX_AI_D1_DATABASE_ID;
            const origin=process.env.APEX_AI_WORKER_ORIGIN;
            if(!/^[a-f0-9-]{36}$/i.test(id))throw Error("Invalid D1 UUID");
            const target=new URL(origin);
            if(target.protocol!=="https:"||target.username||target.password||target.pathname!=="/")
              throw Error("Expected plain HTTPS Worker origin");
            const input=fs.readFileSync("wrangler.template.jsonc","utf8");
            if(!input.includes("REPLACE_WITH_YOUR_CLOUDFLARE_D1_DATABASE_UUID"))
              throw Error("Missing D1 config placeholder");
            fs.writeFileSync("wrangler.jsonc",input.replace(
              "REPLACE_WITH_YOUR_CLOUDFLARE_D1_DATABASE_UUID",id));
          '
      - name: Apply quota schema to operator-owned D1
        run: |
          npx --yes wrangler@4 d1 execute apex-ai-research --remote \
            --file=./schema.sql --config=./wrangler.jsonc
      - name: Deploy new AI Worker (existing news Worker untouched)
        run: npx --yes wrangler@4 deploy --config=./wrangler.jsonc
      - name: Confirm public endpoint without claiming models are available
        run: |
          HEALTH="$(node -e 'console.log(new URL("/health",process.env.APEX_AI_WORKER_ORIGIN).href)')"
          curl -fsS --retry 2 --max-time 15 "$HEALTH" >/tmp/apex-ai-edge-health.json
          node --input-type=module -e '
            const fs=await import("node:fs");
            const data=JSON.parse(fs.readFileSync("/tmp/apex-ai-edge-health.json","utf8"));
            if(data.service!=="apex-ai-edge"||data.state!=="RUNNING")
              throw Error("Worker identity/health check failed");
            if(data.models?.critic!=="@cf/qwen/qwen3.8-27b")
              throw Error("Unexpected model binding");
            console.log("APEX AI Worker deployed; AI quota and model access NOT tested");
          '
