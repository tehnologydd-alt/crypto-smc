name: APEX AI Collective — two-server research checks

on:
  push:
    branches:
      - apex-ai-research-server-stage12-20261112
    paths:
      - 'apex-ai-research/**'
      - '.github/workflows/apex-ai-collective-checks.yml'
  pull_request:
    branches:
      - apex-clean-intelligence-release-safety-stage11-20261112
    paths:
      - 'apex-ai-research/**'
      - '.github/workflows/apex-ai-collective-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edge-agents:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Workers AI/D1 agent syntax and auth
        run: |
          node --check apex-ai-research/edge/worker.mjs
          node --test apex-ai-research/edge/test-worker.mjs
      - name: Ensure demo-only CPU fixtures are excluded from Android APK
        run: |
          test ! -f apex9-preview/apex-ai-research/compute/test_compute.py
          node --check apex9-android/scripts/prepare-web.mjs
  oracle-boosters:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native CPU model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apex-ai-research/compute/requirements.txt
      - name: Run CPU booster training, provenance and no-autopublish tests
        run: python -m unittest discover -s apex-ai-research/compute -p 'test_*.py' -v
      - name: Validate Oracle deployment resource caps
        env:
          APEX_COMPUTE_TOKEN: test-only-no-production-secret-abcdef0123456789
        run: docker compose -f apex-ai-research/compose.yaml config --quiet
