name: APEX 9 Android — Verified 8.6 Baseline
on:
  workflow_dispatch:
  push:
    branches: [apex-9-evolution]
    paths:
      - 'source/APEX_Intelligence_V86.b64.txt'
permissions:
  contents: read
jobs:
  build-from-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore approved APEX 8.6 snapshot, not historical patches
        run: |
          test -f source/APEX_Intelligence_V86.b64.txt || { echo "::error::Verified 8.6 snapshot not yet provided; Android build blocked without it."; exit 1; }
          test ! -e src && test ! -e scripts && test ! -e native || { echo "::error::Checkout has preexisting extracted files"; exit 1; }
          base64 -d source/APEX_Intelligence_V86.b64.txt | tar -xJf -
          node updates/require-v86-source.cjs
      - name: Install, test and lint
        run: |
          npm install --no-audit --no-fund
          npm run test
          npm run lint
          node --test updates/test-v90-evidence.mjs updates/test-v90-market-depth.mjs
      - name: Build web and Android debug
        run: |
          node scripts/generate-icons.js
          npm run build
          npx cap add android
          npx cap sync android
          node scripts/apply-android.js
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APEX-9-Experimental-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
