name: APEX 9 Evidence Core Tests
on:
  push:
    branches: [apex-9-evolution]
    paths:
      - 'updates/v90-evidence.mjs'
      - 'updates/test-v90-evidence.mjs'
      - 'updates/v90-market-depth.mjs'
      - 'updates/test-v90-market-depth.mjs'
      - 'apex9-preview/**'
      - 'apex9-android/scripts/**'
      - 'apex9-news-gateway/**'
      - 'apex9-cloudflare/**'
      - '.github/workflows/apex-9-core-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Multi-source evidence safety and fusion tests
        run: |
          # Catch malformed or duplicated ESM source even when it is not imported by tests.
          for module in apex9-preview/*.mjs apex9-news-gateway/*.mjs; do
            node --check "$module"
          done
          node --check apex9-preview/app.mjs
          node --check apex9-android/scripts/prepare-web.mjs
          node --check apex9-android/scripts/verify-web-modules.mjs
          node --test apex9-news-gateway/test-news-gateway.mjs apex9-news-gateway/test-hosted-tools.mjs apex9-news-gateway/test-news-bridge.mjs apex9-news-gateway/test-reddit-readiness.mjs
          for module in apex9-cloudflare/*.mjs; do node --check "$module"; done
          node --test apex9-cloudflare/test-worker.mjs
          python3 apex9-cloudflare/test-sqlite-quota.py
          node --test apex9-preview/test-forecast-multiframe.mjs
          node --test apex9-preview/test-scenario-journal-state.mjs
          node --test apex9-preview/test-marked-scenario-history.mjs
          node --test apex9-preview/test-forecast-evidence-context.mjs
          node --test apex9-preview/test-forecast-feature-holdout.mjs
          node --test apex9-preview/test-forecast-feature-stability.mjs
          node --check apex9-preview/forecast-shadow-monitor.mjs
          node --test apex9-preview/test-forecast-shadow-forward.mjs
          node --test apex9-preview/test-forecast-shadow-explanation.mjs
          node --test apex9-preview/test-forecast-probability-readiness.mjs
          node --test apex9-preview/test-forecast-preoutcome-strength.mjs
          node --test apex9-preview/test-forecast-feature-ablation.mjs
          node --test apex9-preview/test-forecast-feature-rolling.mjs
          node --test apex9-preview/test-forecast-data-quality-hub.mjs
          node --test apex9-preview/test-overview-research-progress.mjs
          node --test apex9-android/scripts/test-web-modules.mjs
          node --test apex9-android/scripts/test-directional-migration.mjs
          node --check apex9-preview/favorite-dashboard.mjs
          node --check apex9-preview/forecast-card-ux.mjs
          node --check apex9-preview/directional-scenario.mjs
          node --check apex9-preview/forecast-directional-card.mjs
          node --check apex9-preview/forecast-quality.mjs
          node --check apex9-preview/forecast-event-timeline.mjs
          node --check apex9-preview/market-overview.mjs
          node --check apex9-preview/radar-core.mjs
          node --check apex9-preview/radar-dashboard.mjs
          node --check apex9-preview/radar-changes.mjs
          node --check apex9-preview/favorite-radar.mjs
          node --check apex9-preview/favorite-gesture.mjs
          node --check apex9-preview/research.mjs
          node --check apex9-preview/context-sources.mjs
          node --check updates/v90-evidence.mjs
          node --check updates/v90-market-depth.mjs
          node --test updates/test-v90-evidence.mjs updates/test-v90-market-depth.mjs apex9-preview/test-research.mjs apex9-preview/test-context-sources.mjs apex9-preview/test-update-check.mjs apex9-preview/test-mobile-bridge.mjs apex9-preview/test-candles.mjs apex9-preview/test-market-core.mjs apex9-preview/test-forecast-core.mjs apex9-preview/test-favorite-logic.mjs apex9-preview/test-liquidity-core.mjs apex9-preview/test-level-observer.mjs apex9-preview/test-onchain-core.mjs apex9-preview/test-onchain-market-compare.mjs apex9-preview/test-evidence-lab.mjs apex9-preview/test-validation-core.mjs apex9-preview/test-sparkline.mjs apex9-preview/test-journal-stats.mjs apex9-preview/test-forecast-quality.mjs apex9-preview/test-forecast-event-timeline.mjs apex9-preview/test-editorial-core.mjs apex9-preview/test-news-source-fusion.mjs apex9-preview/test-news-evidence.mjs apex9-preview/test-news-coverage.mjs apex9-preview/test-public-rss-client.mjs apex9-preview/test-live-news-collection.mjs apex9-preview/test-source-health.mjs apex9-preview/test-personal-news-client.mjs apex9-preview/test-discussion-evidence.mjs apex9-preview/test-news-gateway-client.mjs apex9-preview/test-editorial-budget.mjs apex9-preview/test-macro-calendar.mjs apex9-preview/test-provider-scheduler.mjs apex9-preview/test-macro-indicators.mjs apex9-preview/test-macro-event-reaction.mjs apex9-preview/test-macro-event-comparison.mjs apex9-preview/test-event-comparison-history.mjs apex9-preview/test-market-event-router.mjs apex9-preview/test-event-history.mjs apex9-preview/test-free-sources.mjs apex9-preview/test-cmc-keyless.mjs apex9-preview/test-source-reconciliation.mjs apex9-preview/test-quality-navigation.mjs apex9-preview/test-research-timeline.mjs apex9-preview/test-scenario-map.mjs apex9-preview/test-scenario-replay.mjs apex9-preview/test-research-patterns.mjs apex9-preview/test-overview-catalog.mjs apex9-preview/test-level-study-navigation.mjs apex9-preview/test-forecast-card-ux.mjs apex9-preview/test-directional-scenario.mjs apex9-preview/test-directional-m5.mjs apex9-preview/test-market-overview.mjs apex9-preview/test-flat-workspace.mjs apex9-preview/test-asset-task-navigation.mjs apex9-preview/test-research-workspace.mjs apex9-preview/test-radar-core.mjs apex9-preview/test-radar-navigation.mjs apex9-preview/test-radar-changes.mjs apex9-preview/test-favorite-radar.mjs apex9-preview/test-mobile-navigation.mjs
      - name: Stage secure HTTPS web edition independently of Android
        env:
          APEX_HOSTED_NEWS_ENABLED: "1"
          APEX_PUBLIC_DOMAIN: "research.example"
          APEX_PROXY_ORIGIN: "https://research.example"
        run: |
          node apex9-news-gateway/prepare-hosted.mjs
          grep -Fq 'name="apex-news-gateway-mode" content="same-origin"' apex9-news-gateway/public/index.html
          grep -Fq 'name="apex-news-gateway-mode" content="disabled"' apex9-preview/index.html
      - name: Package standalone APEX research prototype
        run: zip -r APEX9-Research-Web-Preview.zip apex9-preview updates/v90-evidence.mjs updates/v90-market-depth.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: APEX9-Research-Web-Preview
          path: APEX9-Research-Web-Preview.zip
          if-no-files-found: error
