name: APEX 9 Evidence Core Tests
on:
  push:
    branches: [apex-9-evolution]
    paths:
      - 'updates/v90-evidence.mjs'
      - 'updates/test-v90-evidence.mjs'
      - 'updates/v90-market-depth.mjs'
      - 'updates/test-v90-market-depth.mjs'
      - '.github/workflows/apex-9-core-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Multi-source evidence safety and fusion tests
        run: node --test updates/test-v90-evidence.mjs updates/test-v90-market-depth.mjs
