name: APEX 9 Evidence Core Tests
on:
  push:
    branches: [apex-9-evolution]
    paths:
      - 'updates/v90-evidence.mjs'
      - 'updates/test-v90-evidence.mjs'
      - 'updates/v90-market-depth.mjs'
      - 'updates/test-v90-market-depth.mjs'
      - 'apex9-preview/**'
      - '.github/workflows/apex-9-core-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Multi-source evidence safety and fusion tests
        run: |
          node --check apex9-preview/app.mjs
          node --check apex9-android/scripts/prepare-web.mjs
          node --check apex9-android/scripts/verify-web-modules.mjs
          node --test apex9-android/scripts/test-web-modules.mjs
          node --test apex9-android/scripts/test-directional-migration.mjs
          node --check apex9-preview/favorite-dashboard.mjs
          node --check apex9-preview/forecast-card-ux.mjs
          node --check apex9-preview/directional-scenario.mjs
          node --check apex9-preview/forecast-directional-card.mjs
          node --check apex9-preview/market-overview.mjs
          node --check apex9-preview/radar-core.mjs
          node --check apex9-preview/radar-dashboard.mjs
          node --check apex9-preview/radar-changes.mjs
          node --check apex9-preview/favorite-radar.mjs
          node --check apex9-preview/favorite-gesture.mjs
          node --check apex9-preview/research.mjs
          node --check apex9-preview/context-sources.mjs
          node --check updates/v90-evidence.mjs
          node --check updates/v90-market-depth.mjs
          node --test updates/test-v90-evidence.mjs updates/test-v90-market-depth.mjs apex9-preview/test-research.mjs apex9-preview/test-context-sources.mjs apex9-preview/test-update-check.mjs apex9-preview/test-mobile-bridge.mjs apex9-preview/test-candles.mjs apex9-preview/test-market-core.mjs apex9-preview/test-forecast-core.mjs apex9-preview/test-favorite-logic.mjs apex9-preview/test-liquidity-core.mjs apex9-preview/test-level-observer.mjs apex9-preview/test-onchain-core.mjs apex9-preview/test-onchain-market-compare.mjs apex9-preview/test-evidence-lab.mjs apex9-preview/test-validation-core.mjs apex9-preview/test-sparkline.mjs apex9-preview/test-journal-stats.mjs apex9-preview/test-editorial-core.mjs apex9-preview/test-quality-navigation.mjs apex9-preview/test-research-timeline.mjs apex9-preview/test-scenario-map.mjs apex9-preview/test-scenario-replay.mjs apex9-preview/test-research-patterns.mjs apex9-preview/test-overview-catalog.mjs apex9-preview/test-level-study-navigation.mjs apex9-preview/test-forecast-card-ux.mjs apex9-preview/test-directional-scenario.mjs apex9-preview/test-market-overview.mjs apex9-preview/test-flat-workspace.mjs apex9-preview/test-asset-task-navigation.mjs apex9-preview/test-research-workspace.mjs apex9-preview/test-radar-core.mjs apex9-preview/test-radar-navigation.mjs apex9-preview/test-radar-changes.mjs apex9-preview/test-favorite-radar.mjs apex9-preview/test-mobile-navigation.mjs
      - name: Package standalone APEX research prototype
        run: zip -r APEX9-Research-Web-Preview.zip apex9-preview updates/v90-evidence.mjs updates/v90-market-depth.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: APEX9-Research-Web-Preview
          path: APEX9-Research-Web-Preview.zip
          if-no-files-found: error
