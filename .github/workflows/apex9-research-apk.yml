name: APEX 9 Research - Android APK

on:
  push:
    branches: [apex-9-evolution]
    paths:
      - 'apex9-android/**'
      - 'apex9-preview/**'
      - 'updates/v90-*.mjs'
      - 'updates/test-v90-*.mjs'
      - '.github/workflows/apex9-research-apk.yml'
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'Publish an explicitly approved signed APK on GitHub Releases'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

concurrency:
  group: apex9-preview-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble research preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify Android SDK and install platform
        run: |
          test -n "${ANDROID_HOME:-}" && test -d "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "::error::Android sdkmanager was not found under SDK root"; exit 1; }
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          test -d "$ANDROID_HOME/platforms/android-35"
          echo "Android SDK platform 35 ready"

      - name: Test source adapters and parsing
        run: |
          node --check apex9-preview/app.mjs
          node --check apex9-preview/research.mjs
          node --check apex9-preview/context-sources.mjs
          node --check apex9-preview/mobile-bridge.mjs
          node --check apex9-preview/candles.mjs
          node --check apex9-preview/candle-chart.mjs
          node --check apex9-preview/market-core.mjs
          node --check apex9-preview/forecast-core.mjs
          node --test updates/test-v90-evidence.mjs updates/test-v90-market-depth.mjs apex9-preview/test-research.mjs apex9-preview/test-context-sources.mjs apex9-preview/test-update-check.mjs apex9-preview/test-mobile-bridge.mjs apex9-preview/test-candles.mjs apex9-preview/test-market-core.mjs apex9-preview/test-forecast-core.mjs

      - name: Install Capacitor and stage web assets
        working-directory: apex9-android
        env:
          APEX_KEYSTORE_B64: ${{ secrets.APEX_KEYSTORE_B64 }}
          APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
        run: |
          npm install --no-audit --no-fund
          npm run build:web
          npx cap add android
          node scripts/set-android-version.mjs
          npx cap sync android
          npm run icons
          node scripts/install-native.mjs
          test -s android/app/src/main/java/com/apexintelligence/research/ApexNativePlugin.kt
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/drawable/ic_stat_apex.xml

      - name: Build Android APK with stable release signing when available
        working-directory: apex9-android/android
        env:
          APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=120000
        run: |
          chmod +x gradlew
          if [ -f ../.apex-signed-release ]; then
            TARGET=:app:assembleRelease
          else
            echo "::warning::No stable signing key configured: debug preview cannot upgrade over previous builds."
            TARGET=:app:assembleDebug
          fi
          # GitHub's Gradle distribution CDN can transiently return 502/504.
          # Retry wrapper acquisition/build without changing Android version or signing.
          SUCCESS=0
          for ATTEMPT in 1 2 3 4; do
            if ./gradlew "$TARGET" --no-daemon; then SUCCESS=1; break; fi
            if [ "$ATTEMPT" -lt 4 ]; then
              echo "::warning::Gradle build/download attempt $ATTEMPT failed; retrying."
              sleep $((ATTEMPT * 12))
            fi
          done
          test "$SUCCESS" = 1

      - name: Prepare versioned APK and checksum
        run: |
          mkdir -p apex9-android/output
          if [ -f apex9-android/.apex-signed-release ]; then
            test -s apex9-android/android/app/build/outputs/apk/release/app-release.apk
            cp apex9-android/android/app/build/outputs/apk/release/app-release.apk apex9-android/output/APEX9-Research-Preview-signed.apk
          else
            test -s apex9-android/android/app/build/outputs/apk/debug/app-debug.apk
            cp apex9-android/android/app/build/outputs/apk/debug/app-debug.apk apex9-android/output/APEX9-Research-Preview-debug.apk
          fi
          cp apex9-android/dist/apex-build-info.json apex9-android/output/apex-build-info.json
          (cd apex9-android/output && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh apex9-android/output/*.apk

      - name: Publish approved signed preview for in-app update checks
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f apex9-android/.apex-signed-release || { echo "::error::Publishing requires configured stable signing secrets"; exit 1; }
          test -s apex9-android/output/APEX9-Research-Preview-signed.apk
          gh release create "v9.0.${GITHUB_RUN_NUMBER}" \
            apex9-android/output/APEX9-Research-Preview-signed.apk \
            apex9-android/output/SHA256SUMS.txt \
            --title "APEX 9 Research Preview 9.0.${GITHUB_RUN_NUMBER}" \
            --notes "Research-only Android preview. Public market data; no orders, demo accounts or assistant." \
            --prerelease --target "${GITHUB_SHA}"

      - uses: actions/upload-artifact@v4
        with:
          name: APEX9-Research-Android-APK
          path: apex9-android/output/*
          if-no-files-found: error
          retention-days: 30
