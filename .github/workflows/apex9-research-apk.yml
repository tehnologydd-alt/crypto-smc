name: APEX 9 Research - Android APK

on:
  push:
    branches: [apex-9-evolution]
    paths:
      - 'apex9-android/**'
      - 'apex9-preview/**'
      - 'updates/v90-*.mjs'
      - 'updates/test-v90-*.mjs'
      - '.github/workflows/apex9-research-apk.yml'
  workflow_dispatch:
    inputs:
      publish_prerelease:
        description: 'Publish an explicitly approved signed APK on GitHub Releases'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

concurrency:
  group: apex9-research-apk-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble research preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verify Android SDK and install platform
        run: |
          test -n "${ANDROID_HOME:-}" && test -d "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "::error::Android sdkmanager was not found under SDK root"; exit 1; }
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          test -d "$ANDROID_HOME/platforms/android-35"
          echo "Android SDK platform 35 ready"

      - name: Test source adapters and parsing
        run: |
          # Catch malformed or duplicated ESM source even when it is not imported by tests.
          for module in apex9-preview/*.mjs apex9-news-gateway/*.mjs; do
            node --check "$module"
          done
          grep -Fq 'name="apex-news-gateway-mode" content="disabled"' apex9-preview/index.html
          node --check apex9-preview/app.mjs
          node --check apex9-android/scripts/verify-web-modules.mjs
          node --test apex9-android/scripts/test-web-modules.mjs
          node --test apex9-android/scripts/test-directional-migration.mjs
          node --check apex9-preview/research.mjs
          node --check apex9-preview/context-sources.mjs
          node --check apex9-preview/mobile-bridge.mjs
          node --check apex9-preview/candles.mjs
          node --check apex9-preview/candle-chart.mjs
          node --check apex9-preview/market-core.mjs
          node --check apex9-preview/radar-core.mjs
          node --check apex9-preview/radar-dashboard.mjs
          node --check apex9-preview/radar-changes.mjs
          node --check apex9-preview/favorite-radar.mjs
          node --check apex9-preview/favorite-gesture.mjs
          node --check apex9-preview/forecast-core.mjs
          node --check apex9-preview/directional-scenario.mjs
          node --check apex9-preview/forecast-directional-card.mjs
          node --check apex9-preview/favorite-dashboard.mjs
          node --check apex9-preview/favorite-logic.mjs
          node --check apex9-preview/liquidity-core.mjs
          node --check apex9-preview/liquidity-dashboard.mjs
          node --check apex9-preview/level-observer.mjs
          node --check apex9-preview/level-dashboard.mjs
          node --check apex9-preview/onchain-core.mjs
          node --check apex9-preview/onchain-dashboard.mjs
          node --check apex9-preview/onchain-market-compare.mjs
          node --check apex9-preview/onchain-market-dashboard.mjs
          node --check apex9-preview/evidence-lab.mjs
          node --check apex9-preview/evidence-dashboard.mjs
          node --check apex9-preview/validation-core.mjs
          node --check apex9-preview/validation-dashboard.mjs
          node --check apex9-preview/sparkline.mjs
          node --check apex9-preview/journal-stats.mjs
          node --check apex9-preview/forecast-quality.mjs
          node --check apex9-preview/forecast-event-timeline.mjs
          node --check apex9-preview/research-timeline.mjs
          node --check apex9-preview/scenario-map.mjs
          node --check apex9-preview/scenario-replay.mjs
          node --check apex9-preview/research-patterns.mjs
          node --check apex9-preview/research-patterns-dashboard.mjs
          node --check apex9-preview/research-stability.mjs
          node --check apex9-preview/research-regimes.mjs
          node --check apex9-preview/research-regimes-dashboard.mjs
          node --check apex9-preview/regime-stability.mjs
          node --check apex9-preview/regime-transitions.mjs
          node --check apex9-preview/regime-holdout.mjs
          node --check apex9-preview/cross-asset-research.mjs
          node --check apex9-preview/cross-asset-dashboard.mjs
          node --check apex9-preview/research-synthesis.mjs
          node --check apex9-preview/research-synthesis-dashboard.mjs
          node --check apex9-preview/research-explanation-brief.mjs
          node --check apex9-preview/research-quality-route.mjs
          node --check apex9-preview/research-workspace.mjs
          node --check apex9-preview/research-level-sequence.mjs
          node --check apex9-preview/historical-repair.mjs
          node --check apex9-preview/editorial-core.mjs
          node --check apex9-preview/editorial-dashboard.mjs
          node --check apex9-preview/free-source-budget.mjs
          node --check apex9-preview/free-source-adapters.mjs
          node --check apex9-preview/free-source-dashboard.mjs
          node --check apex9-preview/event-history.mjs
          node --check apex9-preview/asset-quality.mjs
          node --check apex9-preview/editorial-budget.mjs
          node --check apex9-preview/provider-scheduler.mjs
          node --check apex9-preview/macro-calendar.mjs
          node --check apex9-preview/macro-indicators.mjs
          node --check apex9-preview/macro-event-reaction.mjs
          node --check apex9-preview/macro-event-comparison.mjs
          node --check apex9-preview/event-comparison-history.mjs
          node --test updates/test-v90-evidence.mjs updates/test-v90-market-depth.mjs apex9-preview/test-research.mjs apex9-preview/test-context-sources.mjs apex9-preview/test-update-check.mjs apex9-preview/test-mobile-bridge.mjs apex9-preview/test-candles.mjs apex9-preview/test-market-core.mjs apex9-preview/test-forecast-core.mjs apex9-preview/test-favorite-logic.mjs apex9-preview/test-liquidity-core.mjs apex9-preview/test-level-observer.mjs apex9-preview/test-onchain-core.mjs apex9-preview/test-onchain-market-compare.mjs apex9-preview/test-evidence-lab.mjs apex9-preview/test-validation-core.mjs apex9-preview/test-sparkline.mjs apex9-preview/test-journal-stats.mjs apex9-preview/test-forecast-quality.mjs apex9-preview/test-forecast-event-timeline.mjs apex9-preview/test-editorial-core.mjs apex9-preview/test-editorial-budget.mjs apex9-preview/test-macro-calendar.mjs apex9-preview/test-provider-scheduler.mjs apex9-preview/test-macro-indicators.mjs apex9-preview/test-macro-event-reaction.mjs apex9-preview/test-macro-event-comparison.mjs apex9-preview/test-event-comparison-history.mjs apex9-preview/test-market-event-router.mjs apex9-preview/test-event-history.mjs apex9-preview/test-free-sources.mjs apex9-preview/test-quality-navigation.mjs apex9-preview/test-research-timeline.mjs apex9-preview/test-scenario-map.mjs apex9-preview/test-scenario-replay.mjs apex9-preview/test-research-patterns.mjs apex9-preview/test-research-stability.mjs apex9-preview/test-historical-repair.mjs apex9-preview/test-research-regimes.mjs apex9-preview/test-regime-stability.mjs apex9-preview/test-regime-transitions.mjs apex9-preview/test-regime-holdout.mjs apex9-preview/test-cross-asset-research.mjs apex9-preview/test-research-synthesis.mjs apex9-preview/test-research-explanation-brief.mjs apex9-preview/test-research-quality-route.mjs apex9-preview/test-research-workspace.mjs apex9-preview/test-flat-workspace.mjs apex9-preview/test-asset-task-navigation.mjs apex9-preview/test-research-level-sequence.mjs apex9-preview/test-level-study-navigation.mjs apex9-preview/test-directional-scenario.mjs apex9-preview/test-directional-m5.mjs apex9-preview/test-radar-core.mjs apex9-preview/test-radar-navigation.mjs apex9-preview/test-radar-changes.mjs apex9-preview/test-favorite-radar.mjs apex9-preview/test-mobile-navigation.mjs

      - name: Regression - asset UX, historical alignment and network head adapters
        run: |
          node --test \
            apex9-preview/test-asset-favorites-picker.mjs \
            apex9-preview/test-market-matrix-cache.mjs \
            apex9-preview/test-onchain-chain-head.mjs \
            apex9-preview/test-radar-navigation.mjs \
            apex9-preview/test-mobile-navigation.mjs

      - name: Install Capacitor and stage web assets
        working-directory: apex9-android
        env:
          APEX_KEYSTORE_B64: ${{ secrets.APEX_KEYSTORE_B64 }}
          APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
        run: |
          npm install --no-audit --no-fund
          npm run build:web
          test -s dist/forecast-directional-card.mjs
          test -s dist/forecast-feature-holdout.mjs
          test -s dist/forecast-feature-dashboard.mjs
          node -e "import('./scripts/verify-web-modules.mjs').then(m=>{let result=m.verifyWebModuleGraph('./dist');console.log('Verified WebView modules:',result.modules);})"
          npx cap add android
          node scripts/set-android-version.mjs
          npx cap sync android
          npm run icons
          node scripts/install-native.mjs
          test -s android/app/src/main/java/com/apexintelligence/research/ApexAutoForecast.kt
          test -s android/app/src/main/java/com/apexintelligence/research/ApexEvidenceContext.kt
          test -s android/app/src/main/java/com/apexintelligence/research/ApexDirectionalForecast.kt
          test -s android/app/src/main/java/com/apexintelligence/research/ApexM5Evaluation.kt
          test -s android/app/src/main/java/com/apexintelligence/research/ApexResearchLevels.kt
          test -s android/app/src/main/java/com/apexintelligence/research/ApexHistoricalBackfill.kt
          grep -q 'setOnApplyWindowInsetsListener' android/app/src/main/java/com/apexintelligence/research/MainActivity.java
          test -s android/app/src/main/java/com/apexintelligence/research/ApexNativePlugin.kt
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/drawable/ic_stat_apex.xml

      - name: Build Android APK with stable release signing when available
        working-directory: apex9-android/android
        env:
          APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
          APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
          APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=120000
        run: |
          chmod +x gradlew
          if [ -f ../.apex-signed-release ]; then
            TARGET=:app:assembleRelease
          else
            echo "::warning::No stable signing key configured: debug preview cannot upgrade over previous builds."
            TARGET=:app:assembleDebug
          fi
          # GitHub's Gradle distribution CDN can transiently return 502/504.
          # Retry wrapper acquisition/build without changing Android version or signing.
          SUCCESS=0
          for ATTEMPT in 1 2 3 4; do
            if ./gradlew "$TARGET" --no-daemon; then SUCCESS=1; break; fi
            if [ "$ATTEMPT" -lt 4 ]; then
              echo "::warning::Gradle build/download attempt $ATTEMPT failed; retrying."
              sleep $((ATTEMPT * 12))
            fi
          done
          test "$SUCCESS" = 1

      - name: Prepare versioned APK and checksum
        run: |
          mkdir -p apex9-android/output
          if [ -f apex9-android/.apex-signed-release ]; then
            test -s apex9-android/android/app/build/outputs/apk/release/app-release.apk
            cp apex9-android/android/app/build/outputs/apk/release/app-release.apk apex9-android/output/APEX9-Research-Preview-signed.apk
          else
            test -s apex9-android/android/app/build/outputs/apk/debug/app-debug.apk
            cp apex9-android/android/app/build/outputs/apk/debug/app-debug.apk apex9-android/output/APEX9-Research-Preview-debug.apk
          fi
          cp apex9-android/dist/apex-build-info.json apex9-android/output/apex-build-info.json
          (cd apex9-android/output && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh apex9-android/output/*.apk

      - name: Publish approved signed preview for in-app update checks
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f apex9-android/.apex-signed-release || { echo "::error::Publishing requires configured stable signing secrets"; exit 1; }
          test -s apex9-android/output/APEX9-Research-Preview-signed.apk
          gh release create "v9.0.${GITHUB_RUN_NUMBER}" \
            apex9-android/output/APEX9-Research-Preview-signed.apk \
            apex9-android/output/SHA256SUMS.txt \
            --title "APEX 9 Research Preview 9.0.${GITHUB_RUN_NUMBER}" \
            --notes "Research-only Android preview. Public market data; no orders, demo accounts or assistant." \
            --prerelease --target "${GITHUB_SHA}"

      - uses: actions/upload-artifact@v4
        with:
          name: APEX9-Research-Android-APK
          path: apex9-android/output/*
          if-no-files-found: error
          retention-days: 30
