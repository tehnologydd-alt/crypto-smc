name: APEX 9 — news and asset research checks

on:
  push:
    branches: [apex-9-evolution, apex-source-ux-resource-stage5, apex-foreground-depth-cadence-20261111, apex-m1-legacy-label-20261111]
    paths:
      - 'apex9-preview/**'
      - '.github/workflows/apex-9-news-checks.yml'
  pull_request:
    paths:
      - 'apex9-preview/**'
      - '.github/workflows/apex-9-news-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-news:
    name: Node 22 news regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS module syntax
        run: |
          node --check apex9-preview/app.mjs
          node --check apex9-preview/editorial-dashboard.mjs
          node --check apex9-preview/asset-news-context.mjs
          node --check apex9-preview/news-research-analysis.mjs
          node --check apex9-preview/news-evidence.mjs
          node --check apex9-preview/news-m5-reaction.mjs
          node --check apex9-preview/news-m5-budget.mjs
          node --check apex9-preview/news-m5-panel.mjs
          node --check apex9-preview/news-m5-baseline.mjs
          node --check apex9-preview/market-event-router.mjs
          node --check apex9-preview/research-layer-core.mjs
          node --check apex9-preview/research-layer-budget.mjs
          node --check apex9-preview/research-layer-dashboard.mjs
          node --check apex9-preview/overview-cache.mjs
          node --check apex9-preview/favorite-ticker.mjs
          node --check apex9-preview/asset-logo.mjs
          node --check apex9-preview/favorite-dashboard.mjs
          node --check apex9-preview/forecast-multiframe.mjs
          node --check apex9-preview/scenario-journal-state.mjs
          node --test apex9-preview/test-scenario-journal-state.mjs
          node --test apex9-preview/test-marked-scenario-history.mjs
          node --check apex9-preview/forecast-evidence-context.mjs
          node --check apex9-preview/forecast-feature-holdout.mjs
          node --check apex9-preview/forecast-feature-stability.mjs
          node --check apex9-preview/forecast-shadow-forward.mjs
          node --check apex9-preview/forecast-shadow-monitor.mjs
          node --check apex9-preview/forecast-shadow-explanation.mjs
          node --check apex9-preview/forecast-probability-readiness.mjs
          node --check apex9-preview/forecast-probability-dashboard.mjs
          node --check apex9-preview/forecast-preoutcome-strength.mjs
          node --check apex9-preview/forecast-feature-ablation.mjs
          node --check apex9-preview/forecast-feature-rolling.mjs
          node --check apex9-preview/forecast-shadow-challengers.mjs
          node --check apex9-preview/forecast-shadow-regimes.mjs
          node --check apex9-preview/forecast-data-quality-hub.mjs
          node --check apex9-preview/overview-research-progress.mjs
          node --test apex9-preview/test-overview-research-progress.mjs
          node --test apex9-preview/test-forecast-data-quality-hub.mjs
          node --test apex9-preview/test-forecast-feature-rolling.mjs
          node --test apex9-preview/test-forecast-feature-ablation.mjs
          node --test apex9-preview/test-forecast-preoutcome-strength.mjs
          node --test apex9-preview/test-forecast-probability-readiness.mjs
          node --test apex9-preview/test-forecast-shadow-explanation.mjs
          node --test apex9-preview/test-forecast-shadow-forward.mjs
          node --test apex9-preview/test-forecast-feature-stability.mjs
          node --check apex9-preview/forecast-feature-dashboard.mjs
          node --test apex9-preview/test-forecast-evidence-context.mjs
          node --test apex9-preview/test-source-lineage-audit.mjs
          node --test apex9-preview/test-multi-provider-evidence-v2.mjs
          node --test apex9-preview/test-source-provider-forward-audit.mjs
          node --test apex9-preview/test-m1-native-api-stage.mjs
          node --test apex9-preview/test-native-api-integrity.mjs
          node --test apex9-preview/test-forecast-feature-holdout.mjs
          node --check apex9-preview/forecast-directional-card.mjs
          node --check apex9-preview/radar-core.mjs
          node --check apex9-preview/radar-dashboard.mjs
          node --check apex9-preview/radar-auto-policy.mjs
          node --check apex9-preview/radar-display-cache.mjs
          node --check apex9-preview/asset-favorites-picker.mjs
          node --check apex9-preview/market-matrix-cache.mjs
          node --check apex9-preview/onchain-chain-head.mjs
          node --check apex9-preview/onchain-dashboard.mjs
      - name: Compact forecast and quality UI regression
        run: |
          node --test \
            apex9-preview/test-quality-navigation.mjs \
            apex9-preview/test-forecast-event-timeline.mjs \
            apex9-preview/test-forecast-quality.mjs
      - name: Independent M15/H4 forecast chronology and future-data guards
        run: |
          node --test apex9-preview/test-forecast-multiframe.mjs
      - name: News and asset attribution regression tests
        run: |
          node --test \
            apex9-preview/test-asset-news-context.mjs \
            apex9-preview/test-news-research-analysis.mjs \
            apex9-preview/test-news-coverage.mjs \
            apex9-preview/test-news-evidence.mjs \
            apex9-preview/test-news-source-fusion.mjs \
            apex9-preview/test-market-event-router.mjs \
            apex9-preview/test-personal-news-client.mjs \
            apex9-preview/test-news-m5-reaction.mjs \
            apex9-preview/test-news-m5-budget.mjs \
            apex9-preview/test-news-m5-baseline.mjs \
            apex9-preview/test-context-sources.mjs \
            apex9-preview/test-event-history.mjs

      - name: Public research layers and UI regression tests
        run: |
          node --test \
            apex9-preview/test-research-layer-core.mjs \
            apex9-preview/test-research-layer-budget.mjs \
            apex9-preview/test-research-layer-ui.mjs
      - name: Favorite-only monitoring and stable overview cache
        run: |
          node --test \
            apex9-preview/test-favorite-ticker.mjs \
            apex9-preview/test-overview-cache.mjs \
            apex9-preview/test-favorites-scope.mjs \
            apex9-preview/test-radar-core.mjs \
            apex9-preview/test-overview-catalog.mjs
      - name: Automatic Radar foreground and Android background research
        run: |
          node --test \
            apex9-preview/test-radar-auto.mjs \
            apex9-preview/test-radar-background-integration.mjs \
            apex9-preview/test-radar-changes.mjs \
            apex9-preview/test-radar-core.mjs
      - name: Asset cleanup and keyless chain snapshots
        run: |
          node --test \
            apex9-preview/test-asset-favorites-picker.mjs \
            apex9-preview/test-market-matrix-cache.mjs \
            apex9-preview/test-onchain-chain-head.mjs \
            apex9-preview/test-radar-navigation.mjs \
            apex9-preview/test-mobile-navigation.mjs \
            apex9-preview/test-onchain-core.mjs
