services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /home/node/data
      APP_TOKEN: ${APP_TOKEN:?Set APP_TOKEN in .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - orbit_data:/home/node/data
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  orbit_data:
  caddy_data:
  caddy_config:

