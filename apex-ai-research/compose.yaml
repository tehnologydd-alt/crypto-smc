services:
  cpu-research:
    build:
      context: ./compute
    restart: unless-stopped
    environment:
      APEX_COMPUTE_TOKEN: "${APEX_COMPUTE_TOKEN:?Set strong local server token}"
      APEX_MODEL_DIR: /srv/apex/models
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    ports:
      - "127.0.0.1:8789:8080"
    volumes:
      - ./model_store:/srv/apex/models
      - ./verified_observations:/srv/apex/verified_observations:ro
    mem_limit: 8g
    cpus: "2.0"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
