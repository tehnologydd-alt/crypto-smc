<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  
  <!-- Background with subtle rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Grid lines background -->
  <path d="M 60 160 L 452 160 M 60 260 L 452 260 M 60 360 L 452 360" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>
  <path d="M 160 60 L 160 452 M 260 60 L 260 452 M 360 60 L 360 452" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Smart Money Order Block Zone Highlight -->
  <rect x="90" y="270" width="332" height="70" rx="8" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="105" y="292" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold" letter-spacing="1">BULLISH ORDER BLOCK [OB+]</text>

  <!-- Candlesticks SMC -->
  <!-- Candle 1: Red impulse -->
  <line x1="140" y1="130" x2="140" y2="290" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <rect x="125" y="150" width="30" height="110" rx="4" fill="#ef4444"/>

  <!-- Candle 2: Order block base candle -->
  <line x1="210" y1="260" x2="210" y2="340" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <rect x="195" y="280" width="30" height="45" rx="4" fill="url(#amberGrad)"/>

  <!-- Candle 3: Massive Bullish Displacement / Break of Structure -->
  <line x1="280" y1="180" x2="280" y2="340" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <rect x="265" y="200" width="30" height="100" rx="4" fill="url(#emeraldGrad)"/>

  <!-- Candle 4: Continuous Bullish Expansion -->
  <line x1="350" y1="90" x2="350" y2="240" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <rect x="335" y="110" width="30" height="95" rx="4" fill="url(#emeraldGrad)"/>

  <!-- Whale Fin / Radar Dynamic Crest -->
  <path d="M 120 420 C 220 420, 260 380, 310 330 C 340 300, 390 270, 430 250 C 400 280, 360 330, 340 370 C 310 430, 240 445, 120 420 Z" fill="url(#cyanGrad)" opacity="0.9"/>
  <circle cx="340" cy="330" r="6" fill="#ffffff"/>
  <circle cx="340" cy="330" r="14" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <circle cx="340" cy="330" r="24" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.5"/>
</svg>
